# Only a real WebSocket upgrade is passed on (Vite HMR); any other Upgrade,
# such as h2c, is dropped so it cannot be smuggled to a backend (W6, G27).
map $http_upgrade $ws_upgrade {
    websocket websocket;
    default   "";
}
map $http_upgrade $ws_connection {
    websocket upgrade;
    default   "";
}

server {
    listen 80;
    server_name localhost;

    # Route /api/* → Express API
    location /api/ {
        proxy_pass         http://api:3001/;
        proxy_http_version 1.1;
        proxy_set_header   Host $server_name;
    }

    # WebSocket for live scan events
    location /ws/ {
        proxy_pass         http://api:3001/;
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header   Upgrade $ws_upgrade;
        proxy_set_header   Connection $ws_connection;
    }

    # Everything else → Vite dev server
    location / {
        proxy_pass         http://web:3000;
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header   Upgrade $ws_upgrade;
        proxy_set_header   Connection $ws_connection;
        proxy_set_header   Host $server_name;
        proxy_cache_bypass $ws_upgrade;
    }
}
