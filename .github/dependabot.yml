version: 2
updates:
  # npm workspaces (api, worker, web, admin, shared) share the root lockfile.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directories:
      - "/vairiot-reports"
      - "/scripts"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: gradle
    directory: "/vairiot-mobile"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  # Base images of every service. (Images named only in the compose files —
  # postgres, redis, nginx, minio — are not covered: bump those by hand.)
  - package-ecosystem: docker
    directories:
      - "/vairiot-api"
      - "/vairiot-worker"
      - "/vairiot-web"
      - "/vairiot-admin"
      - "/vairiot-reports"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
