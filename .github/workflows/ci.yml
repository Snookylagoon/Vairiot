name: Vairiot CI

on:
  # `dev` is this repo's working branch — scripts/deploy-dev.sh pushes it and
  # scripts/go-live.sh promotes it to main. The trigger said `develop`, which
  # has never existed here, so CI only ever ran on main (after a change was
  # already in production) and on Dependabot PRs. Every change made on dev
  # reached production having been checked locally and nowhere else.
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Least privilege (standard §10.2): jobs ask for more only when they need it.
permissions:
  contents: read

# A newer push cancels the older run, except on main, so image pushes are
# never cut short.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Lint & type-check ─────────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 LTS — the same version as every Dockerfile and the engines floor.
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # One product version in every package, app and service (standard §8.2).
      - name: Version files agree
        run: npm run check:versions

      # vairiot-shared is consumed via its compiled dist/ (main + types), which
      # is gitignored and has no prepare hook, so npm ci does NOT build it.
      # Build it before anything type-checks/lints the workspaces that import it,
      # otherwise: "Cannot find module 'vairiot-shared'".
      - name: Build shared package
        run: npm run build --workspace vairiot-shared

      # The machine-enforced build rules (standard §4): 500-line limit with
      # a shrink-only baseline, and British English.
      - name: File length
        run: npm run check:lines

      - name: British English
        run: npm run check:spelling

      - name: ESLint (errors fail the build)
        run: npm run lint

      - name: Type-check API
        working-directory: vairiot-api
        run: npx tsc --noEmit

      - name: Type-check Worker
        working-directory: vairiot-worker
        run: npx tsc --noEmit

      - name: Type-check Web
        working-directory: vairiot-web
        run: npx tsc --noEmit

      - name: Type-check Admin
        working-directory: vairiot-admin
        run: npx tsc --noEmit

      - name: Type-check Shared
        working-directory: vairiot-shared
        run: npx tsc --noEmit

      # The database-free suites. (The API suite needs Postgres and Redis and
      # runs in its own job below.) Until S0.5 nothing ran these in CI.
      # With coverage gates (D8 ratchet, stages 2.1-2.2): each package fails below
      # its measured floor.
      - name: Unit tests with coverage (worker, shared, web, admin)
        run: npm run test:coverage --workspace=vairiot-worker --workspace=vairiot-shared --workspace=vairiot-web --workspace=vairiot-admin

  # ── API tests ────────────────────────────────────────────────────────────────
  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    # Backstop: the suite runs in ~15s, but leaked handles used to hang jest
    # indefinitely (see --forceExit below). Fail fast if that ever regresses.
    timeout-minutes: 15

    services:
      postgres:
        # Same image as every stack (D11).
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: vairiot_test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: vairiot_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Tests import services that import vairiot-shared — build its dist/ first.
      - name: Build shared package
        run: npm run build --workspace vairiot-shared

      - name: Run Prisma migrations (test DB)
        working-directory: vairiot-api
        env:
          DATABASE_URL: postgresql://vairiot_test:testpassword@localhost:5432/vairiot_test
        run: npx prisma migrate deploy

      - name: Run API tests
        working-directory: vairiot-api
        env:
          DATABASE_URL: postgresql://vairiot_test:testpassword@localhost:5432/vairiot_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-not-for-production-32ch
          APP_ENCRYPTION_KEY: ci-test-encryption-key-32-chars!!
          NODE_ENV: test
        # --forceExit: the suite leaks open handles (Prisma/Redis/BullMQ aren't
        # closed in teardown), so jest completes every test then never exits.
        # Follow-up: fix teardown so this isn't needed.
          JEST_JUNIT_OUTPUT_DIR: reports/junit
        run: npx jest --runInBand --coverage --forceExit --reporters=default --reporters=jest-junit

      # Test results and coverage for every run (standard §10.2).
      - name: Upload API test results and coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-test-results
          path: |
            vairiot-api/reports/junit
            vairiot-api/coverage
          if-no-files-found: ignore

  # ── Browser smoke tests ──────────────────────────────────────────────────────
  # Playwright against the web app with the API mocked (stage 1.20, G30): the
  # S1.4 map gate in a real browser. The Docker-stack run comes later.
  e2e-web:
    name: Web smoke (Playwright)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build shared package
        run: npm run build --workspace vairiot-shared

      - name: Type-check the smoke tests
        working-directory: vairiot-web
        run: npx tsc -p e2e --noEmit

      - name: Install Chromium
        working-directory: vairiot-web
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        working-directory: vairiot-web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-e2e-results
          path: |
            vairiot-web/test-results
            vairiot-web/playwright-report
          if-no-files-found: ignore

  # ── Docker images ────────────────────────────────────────────────────────────
  # Every service image must at least build on every PR; on pushes to main the
  # images are also published to GHCR so deploys can `docker compose pull`
  # instead of building on the prod box (instant rollback = previous tag).
  docker:
    name: Docker ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-typecheck
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, web, admin, reports, minio]
        include:
          - service: reports
            context: vairiot-reports
          # MinIO built from source (no upstream images any more). Publishing
          # it to GHCR keeps a copy we control for new servers and restores.
          - service: minio
            context: infra/minio
            file: infra/minio/Dockerfile
    env:
      BUILD_CONTEXT: ${{ matrix.context || '.' }}
      DOCKERFILE: ${{ matrix.file || format('vairiot-{0}/Dockerfile', matrix.service) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # GHCR repository names must be lowercase; the owner login can contain
      # capitals (e.g. "Snookylagoon"), which makes the tag invalid.
      - name: Lowercase image owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/vairiot-${{ matrix.service }}:latest
            ghcr.io/${{ steps.owner.outputs.value }}/vairiot-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ── Register profiling tool (scripts/profile-register.py) ───────────────────
  scripts:
    name: Scripts (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt
      - name: Install
        run: pip install -r scripts/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s scripts/tests -v


  # ── Security (standard §11.3) ────────────────────────────────────────────────
  # Dependencies, code, containers and secrets on every push and pull request.
  # Scanner versions are pinned and at least seven days old.
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: Gitleaks scans every commit, and Semgrep compares
          # against the merge base.
          fetch-depth: 0

      - name: npm audit (high and critical fail)
        run: npm audit --audit-level=high --omit=dev

      # The release binary rather than the container, which git inside would
      # refuse to read ("dubious ownership") as a different user.
      - name: Gitleaks (secrets in history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --redact --no-banner -c .gitleaks.toml .

      # Vulnerabilities, misconfiguration and secrets all block. The app images
      # run unprivileged (W6). MinIO still runs as root over root-owned data
      # (G32), and the Dockerfile.dev images only run on developers' machines.
      - name: Trivy (dependencies, misconfiguration, secrets)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.75.0
          fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL
          --exit-code 1 --ignorefile .trivyignore --skip-version-check
          --skip-dirs node_modules --skip-files infra/minio/Dockerfile
          --skip-files '**/Dockerfile.dev' .

      # OWASP Top Ten rules. Findings that predate stage 0.10 are triaged in
      # docs/standard-adoption-plan.md (G27); only new ones fail the build.
      - name: Semgrep (OWASP Top Ten, new findings fail)
        env:
          BASE_REF: ${{ github.base_ref || 'dev' }}
        run: |
          pip install --quiet semgrep==1.179.0
          git fetch --no-tags origin "$BASE_REF"
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          if [ "$base" = "$(git rev-parse HEAD)" ]; then base="$(git rev-parse HEAD~1)"; fi
          semgrep scan --config p/owasp-top-ten --error --metrics=off \
            --exclude node_modules --baseline-commit "$base"
