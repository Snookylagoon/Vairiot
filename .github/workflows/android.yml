name: Android

# Split out of ci.yml so it only runs when the Android app actually changes.
#
# It is the single most expensive job in the pipeline — 195s against 65-97s for
# everything else — and vairiot-mobile changes rarely: nothing in a week of
# backend and frontend work touched it. Running it on every push to dev spent
# more CI time than the rest of the pipeline combined, on a build that could
# not have been affected.
#
# Path-filtered rather than restricted to main, so mobile work still gets CI on
# the branch it is developed on. It also no longer waits on the TypeScript
# lint-typecheck job, which had nothing to do with a Gradle build.
on:
  push:
    branches: [main, dev]
    paths:
      - 'vairiot-mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'vairiot-mobile/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  android:
    name: Android Build, Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('vairiot-mobile/**/*.gradle*', 'vairiot-mobile/**/gradle-wrapper.properties', 'vairiot-mobile/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        working-directory: vairiot-mobile
        run: chmod +x ./gradlew

      - name: Android lint
        working-directory: vairiot-mobile
        run: ./gradlew lintDebug --no-daemon --stacktrace

      # JUnit 5 / Robolectric unit tests; until stage 0.10 CI never ran them.
      - name: Unit tests
        working-directory: vairiot-mobile
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        working-directory: vairiot-mobile
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload lint report and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-reports
          path: |
            vairiot-mobile/app/build/reports/lint-results-debug.html
            vairiot-mobile/app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
