# Exit-gate stack (stages 1.21, 2.17): isolated from the dev stack by its own
# project, container names, named volumes and ports 18080/18443. Paths are
# relative to infra/, the first compose file's directory.
services:
  postgres:
    container_name: gate_postgres
    volumes: !override [ "pgdata:/var/lib/postgresql/data" ]
  redis:
    container_name: gate_redis
    volumes: !override [ "redisdata:/data" ]
  minio:
    container_name: gate_minio
    volumes: !override [ "miniodata:/data" ]
  minio-init: { container_name: gate_minio_init }
  migrate: { container_name: gate_migrate }
  api: { container_name: gate_api }
  reports: { container_name: gate_reports }
  web: { container_name: gate_web }
  admin: { container_name: gate_admin }
  worker: { container_name: gate_worker }
  nginx:
    container_name: gate_nginx
    ports: !override [ "18080:80", "18443:443" ]
    volumes: !override
      - ./nginx/standalone-default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/standalone.conf.template:/etc/nginx/templates/vairiot.conf.template:ro
      - ${GATE_DIR}/tls:/etc/vairiot/tls:ro
      - ${GATE_DIR}/le:/etc/letsencrypt:ro
      - ${GATE_DIR}/certbot:/var/www/certbot:ro
volumes: { pgdata: {}, redisdata: {}, miniodata: {} }
